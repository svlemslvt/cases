{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-5">
        <div class="card">
            <div class="card-header">Перевод средств</div>
            <div class="card-body">
                <p>Ваш баланс: <strong>{{ balance }} ₽</strong></p>
                <form method="POST" action="{{ url_for('transfers') }}">
                    <div class="form-group mb-3">
                        <input type="text" name="to_username" class="form-control" placeholder="Логин получателя" required>
                    </div>
                    <div class="form-group mb-3">
                        <input type="number" step="0.01" name="amount" class="form-control" placeholder="Сумма" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Перевести</button>
                </form>
            </div>
        </div>
    </div>
</div>

{% endblock %}
