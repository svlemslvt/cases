{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4">
        <div class="card">
            <div class="card-header"><i class="fas fa-sign-in-alt"></i> Вход</div>
            <div class="card-body">
                <form method="POST">
                    <div class="form-group mb-3">
                        <input type="text" name="username" class="form-control" placeholder="Логин" required>
                    </div>
                    <div class="form-group mb-3">
                        <input type="password" name="password" class="form-control" placeholder="Пароль" required>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" name="remember" id="remember" class="form-check-input">
                        <label for="remember" class="form-check-label">Запомнить меня (на 30 дней)</label>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <hr>
                <p class="text-center">Нет аккаунта? <a href="{{ url_for('register') }}">Регистрация</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
