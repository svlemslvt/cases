{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card mb-3">
            <div class="card-header">Смена пароля</div>
            <div class="card-body">
                <form method="POST">
                    <div class="form-group mb-2"><input type="password" name="old_password" class="form-control" placeholder="Старый пароль"></div>
                    <div class="form-group mb-2"><input type="password" name="new_password" class="form-control" placeholder="Новый пароль"></div>
                    <div class="form-group mb-2"><input type="password" name="confirm_password" class="form-control" placeholder="Подтвердите"></div>
                    <button class="btn btn-primary">Сменить пароль</button>
                </form>
            </div>
        </div>
<div class="card mb-3">
    <div class="card-header">Тема</div>
    <div class="card-body">
        <form method="POST">
            <select name="theme" class="form-select mb-2">
                <option value="light" {% if user.settings.theme == 'light' %}selected{% endif %}>Светлая</option>
                <option value="dark" {% if user.settings.theme == 'dark' %}selected{% endif %}>Тёмная</option>
            </select>
            <button class="btn btn-primary">Применить</button>
        </form>
    </div>
</div>
        </div>
        <div class="card">
            <div class="card-header">Язык</div>
            <div class="card-body">
                <form method="POST">
                    <select name="language" class="form-select mb-2">
                        <option value="ru" {% if user.settings.language == 'ru' %}selected{% endif %}>Русский</option>
                        <option value="en" {% if user.settings.language == 'en' %}selected{% endif %}>English</option>
                    </select>
                    <button class="btn btn-primary">Сменить язык</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
<div class="card mb-3">
    <div class="card-header">Тема оформления</div>
    <div class="card-body">
        <select id="themeSelect" class="form-select mb-2">
            <option value="light" {% if user.settings.theme == 'light' %}selected{% endif %}>Светлая</option>
            <option value="dark" {% if user.settings.theme == 'dark' %}selected{% endif %}>Тёмная</option>
            <option value="cats" {% if user.settings.theme == 'cats' %}selected{% endif %}>Котики (шарики)</option>
        </select>
        <button id="applyThemeBtn" class="btn btn-primary">Применить тему</button>
    </div>
</div>
<script>
document.getElementById('applyThemeBtn').addEventListener('click', async () => {
    const theme = document.getElementById('themeSelect').value;
    const response = await fetch('/theme_api', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({theme})
    });
    const data = await response.json();
    if (data.success) {
        location.reload(); // применить тему сразу (проще, чем менять классы вручную)
    }
});
</script>
